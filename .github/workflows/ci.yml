name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    env:
      # The offline triple. No paid API, no model download, deterministic output -- which is what
      # lets the retrieval evaluation run on every pull request instead of nightly-and-ignored.
      LLM_PROVIDER: none
      EMBEDDING_PROVIDER: hashing
      RERANKER_PROVIDER: identity
      CONTEXTUALIZER: template

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Unit tests
        run: uv run pytest -m "not integration and not evals" -q --cov=app --cov-report=term-missing

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s --health-timeout 5s --health-retries 20

      opensearch:
        image: opensearchproject/opensearch:2.19.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30

    env:
      DATABASE_URL: postgresql+asyncpg://erp:erp@localhost:5432/erp_test
      OPENSEARCH_URL: http://localhost:9200
      LLM_PROVIDER: none
      EMBEDDING_PROVIDER: hashing
      RERANKER_PROVIDER: identity

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --frozen

      # The migration must apply cleanly to the database we actually ship on, and must leave no
      # drift against the models. `alembic check` is the guard for the second half.
      - name: Migrations apply and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: App serves an OpenAPI schema
        run: uv run python -c "from app.main import create_app; s=create_app().openapi(); print(len(s['paths']), 'paths')"

      - name: Integration and security tests
        run: uv run pytest -m integration -q

      # Retrieval quality is a build gate, not a dashboard someone remembers to look at. The
      # runner fails on an absolute threshold breach *and* on a >2 point regression against the
      # committed baseline -- thresholds catch collapses, the relative gate catches slow bleed.
      # Runs in ~20s on the offline triple, which is what keeps it on every PR rather than
      # nightly-and-ignored.
      #
      # Deliberately NOT piped through `tee`: GitHub's default shell is `bash -e`, without
      # `pipefail`, so a pipeline takes the exit code of its last command. `eval | tee` would
      # report success whenever tee succeeded -- a quality gate that silently never fails.
      - name: Retrieval evaluation and ablation table
        run: |
          set -o pipefail
          uv run python -m app.cli eval --ablate --fail-under-thresholds --baseline app/evals/baseline.json > eval.txt
        continue-on-error: false

      - name: Publish the ablation table to the run summary
        if: always()
        run: |
          {
            echo '## Retrieval ablation'
            echo '```'
            cat eval.txt 2>/dev/null || echo 'the evaluation did not produce a table'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    if: hashFiles('frontend/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # uv is here for one test: the capability table the frontend renders from must equal the
      # backend enum, and that test regenerates it rather than comparing two checked-in copies.
      # Without uv it skips silently, which would make the one check that matters a no-op in the
      # one place it matters.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

      - name: Fail if the generated capability table is stale
        run: |
          uv run python -m app.cli capabilities > /tmp/capabilities.ts
          diff -u ../frontend/src/auth/capabilities.generated.ts /tmp/capabilities.ts
        working-directory: backend

  byoc:
    name: BYOC topology
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The claim is that bring-your-own-cloud is packaging rather than a second product. If that
    # ever stopped being true, the tenant-isolation suite would be the first thing to diverge --
    # and running it against only the SaaS compose file would hide exactly that.
    steps:
      - uses: actions/checkout@v4

      - name: Validate the BYOC compose file
        env:
          ERP_IMAGE: erp/backend:ci
          DATABASE_URL: postgresql+asyncpg://erp:erp@db:5432/erp_test
          OPENSEARCH_URL: https://opensearch:9200
          REDIS_URL: redis://redis:6379/0
          JWT_SECRET: ci-secret-at-least-thirty-two-characters-long
          PUBLIC_BASE_URL: https://ci.example.com
          BLOB_BUCKET: erp-ci
        run: docker compose -f docker-compose.byoc.yml config --quiet

      - name: Fail if the BYOC file could fall back to bundled infrastructure
        run: |
          set -o pipefail
          for required in DATABASE_URL OPENSEARCH_URL REDIS_URL JWT_SECRET; do
            grep -q "\${$required:?" docker-compose.byoc.yml               || { echo "$required must be required, not defaulted"; exit 1; }
          done

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Bring up the BYOC topology
        env:
          ERP_IMAGE: erp/backend:ci
          DATABASE_URL: postgresql+asyncpg://erp:erp@localhost:5432/erp_test
          OPENSEARCH_URL: http://localhost:9200
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-secret-at-least-thirty-two-characters-long
          PUBLIC_BASE_URL: http://localhost:8001
          BLOB_BUCKET: erp-ci
        run: |
          # The customer-provided services, stood up as containers for the purposes of the test.
          # The point is the application configuration, not who operates Postgres.
          docker compose up -d db opensearch redis
          docker compose -f docker-compose.byoc.yml build 2>/dev/null || true

      - name: Tenant isolation against the BYOC configuration
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://erp:erp@localhost:5432/erp_test
          OPENSEARCH_URL: http://localhost:9200
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-secret-at-least-thirty-two-characters-long
          EMBEDDING_CACHE_SCOPE: tenant
          TRACE_CONTENT_CAPTURE: "false"
          LLM_PROVIDER: none
          EMBEDDING_PROVIDER: hashing
          RERANKER_PROVIDER: identity
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run pytest -m integration -q -k "tenant or isolation or acl"
