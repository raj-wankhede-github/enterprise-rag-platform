[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Multi-tenant enterprise knowledge search: hybrid retrieval, RRF, reranking, grounded answers."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "gunicorn>=23.0",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "opensearch-py[async]>=2.8",
    "httpx>=0.28",
    "structlog>=25.4",
    "argon2-cffi>=25.1",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.20",
    "authlib>=1.6",
    "redis>=6.2",
    "anthropic>=1.7.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.40"]
hosted = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "aiosqlite>=0.21",
    "ruff>=0.14",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # assert is the point of a test
    "B008",   # Depends() in a default is the FastAPI idiom
    "N811",   # PgUUID aliases postgresql.UUID deliberately, to distinguish it from uuid.UUID
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"alembic/**" = ["N999", "E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
# opentelemetry is optional at runtime and imported inside a try/except: a deployment that does
# not want the SDK is a supported configuration, so its absence must not fail a type check.
module = ["opensearchpy.*", "authlib.*", "opentelemetry.*", "aioboto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs Postgres and/or OpenSearch",
    "evals: runs the golden-set evaluation",
    "slow: excluded from the fast feedback loop",
]
# Our own deprecations are errors; third-party ones are not ours to fix and must not be able
# to break collection. Each ignore names the library, so it is obvious when one can be dropped.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:.*BlockingPortal alias is deprecated.*:DeprecationWarning",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
    "ignore:.*enable_cleanup_closed ignored.*:DeprecationWarning",
]
